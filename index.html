<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carnes AI Stream</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:48px auto;padding:0 18px;line-height:1.5}
    textarea{width:100%;min-height:120px;padding:12px;box-sizing:border-box}
    button{margin-top:12px;padding:10px 16px}
    pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;min-height:80px}
  </style>
</head>
<body>
  <h1>Carnes AI Stream</h1>
  <p>Streams responses through Vercel AI Gateway using <code>openai/gpt-5.6-sol</code>.</p>
  <textarea id="prompt">Why is the sky blue?</textarea><br />
  <button id="send">Ask</button>
  <pre id="output"></pre>
  <script>
    const button = document.getElementById('send')
    const prompt = document.getElementById('prompt')
    const output = document.getElementById('output')

    button.addEventListener('click', async () => {
      output.textContent = ''
      button.disabled = true
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ prompt: prompt.value }),
        })
        if (!res.ok) throw new Error(await res.text())
        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        while (true) {
          const { value, done } = await reader.read()
          if (done) break
          output.textContent += decoder.decode(value, { stream: true })
        }
      } catch (error) {
        output.textContent = String(error)
      } finally {
        button.disabled = false
      }
    })
  </script>
</body>
</html>
